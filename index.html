<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ลงทะเบียน — น้อง Powdy</title>
  <script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    .header { width: 100%; background: linear-gradient(135deg, #00b900, #00a000); color: white; padding: 24px 20px 20px; text-align: center; }
    .header .avatar { width: 64px; height: 64px; border-radius: 50%; background: white; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 32px; }
    .header h1 { font-size: 20px; font-weight: 700; }
    .header p  { font-size: 13px; opacity: 0.9; margin-top: 4px; }
    .user-badge { background: white; border-radius: 12px; margin: 16px 16px 0; padding: 12px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); width: calc(100% - 32px); }
    .user-badge .dot { width: 36px; height: 36px; border-radius: 50%; background: #e8f5e9; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .user-badge .name { font-size: 14px; color: #333; font-weight: 600; }
    .user-badge .sub  { font-size: 12px; color: #888; }
    .card { background: white; border-radius: 16px; margin: 12px 16px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); width: calc(100% - 32px); }
    .card h2 { font-size: 15px; font-weight: 700; color: #333; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 2px solid #f0f4f8; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; color: #555; font-weight: 600; margin-bottom: 6px; }
    .field label span { color: #e53935; margin-left: 2px; }
    .field input, .field select { width: 100%; padding: 12px 14px; border: 1.5px solid #e0e0e0; border-radius: 10px; font-size: 15px; color: #333; background: #fafafa; appearance: none; -webkit-appearance: none; transition: border-color 0.2s; }
    .field input:focus, .field select:focus { outline: none; border-color: #00b900; background: white; }
    .field input.error, .field select.error { border-color: #e53935; }
    .field .err-msg { font-size: 12px; color: #e53935; margin-top: 4px; display: none; }
    .field.has-error .err-msg { display: block; }
    .select-wrap { position: relative; }
    .select-wrap::after { content: '▾'; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #888; pointer-events: none; }
    .role-hint { font-size: 12px; color: #888; margin-top: 6px; padding: 8px 12px; background: #f5f5f5; border-radius: 8px; display: none; }
    .role-hint.show { display: block; }
    .btn-submit { width: 100%; padding: 14px; background: #00b900; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 4px; transition: background 0.2s, transform 0.1s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { background: #a5d6a7; cursor: not-allowed; }
    .btn-submit .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
    .btn-submit.loading .spinner { display: block; }
    .btn-submit.loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #success-screen { display: none; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; text-align: center; flex: 1; }
    #success-screen.show { display: flex; }
    .success-icon { width: 80px; height: 80px; border-radius: 50%; background: #e8f5e9; display: flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 20px; }
    #success-screen h2 { font-size: 22px; color: #1b5e20; margin-bottom: 10px; }
    #success-screen p  { font-size: 15px; color: #555; line-height: 1.6; }
    .btn-close { margin-top: 28px; padding: 14px 32px; background: #00b900; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; }
    #loading { position: fixed; inset: 0; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 99; }
    #loading.hide { display: none; }
    .loading-spinner { width: 36px; height: 36px; border: 3px solid #e0e0e0; border-top-color: #00b900; border-radius: 50%; animation: spin 0.8s linear infinite; }
    #loading p { font-size: 14px; color: #888; }
  </style>
</head>
<body>

<div id="loading">
  <div class="loading-spinner"></div>
  <p>กำลังโหลด...</p>
</div>

<div id="form-screen" style="width:100%; display:none; flex-direction:column; align-items:center;">
  <div class="header">
    <div class="avatar">🤖</div>
    <h1>น้อง Powdy</h1>
    <p>ลงทะเบียนเพื่อใช้งานระบบตรวจสอบสินค้า</p>
  </div>
  <div class="user-badge">
    <div class="dot">👤</div>
    <div>
      <div class="name" id="line-display-name">กำลังโหลด...</div>
      <div class="sub">บัญชี LINE ของคุณ</div>
    </div>
  </div>
  <div class="card">
    <h2>📋 ข้อมูลพนักงาน</h2>
    <div class="field" id="field-full-name">
      <label>ชื่อ-นามสกุล <span>*</span></label>
      <input type="text" id="full_name" placeholder="เช่น สมชาย ใจดี" />
      <div class="err-msg">กรุณากรอกชื่อ-นามสกุล</div>
    </div>
    <div class="field" id="field-employee-id">
      <label>รหัสพนักงาน <span>*</span></label>
      <input type="text" id="employee_id" placeholder="เช่น EMP001" />
      <div class="err-msg">กรุณากรอกรหัสพนักงาน</div>
    </div>
    <div class="field" id="field-primary-branch">
      <label>สาขาหลัก <span>*</span></label>
      <input type="text" id="primary_branch" placeholder="เช่น สาขาลาดพร้าว" />
      <div class="err-msg">กรุณากรอกสาขาหลัก</div>
    </div>
    <div class="field" id="field-role">
      <label>บทบาท <span>*</span></label>
      <div class="select-wrap">
        <select id="role">
          <option value="">-- เลือกบทบาท --</option>
          <option value="fixed_branch">พนักงานสาขา</option>
          <option value="driver">พนักงานขับรถ</option>
          <option value="warehouse">คลัง</option>
          <option value="supervisor">Supervisor</option>
        </select>
      </div>
      <div class="err-msg">กรุณาเลือกบทบาท</div>
      <div class="role-hint" id="role-hint"></div>
    </div>
    <button class="btn-submit" id="btn-submit" onclick="submitForm()">
      <div class="spinner"></div>
      <span class="btn-text">✅ ลงทะเบียน</span>
    </button>
  </div>
</div>

<div id="success-screen">
  <div class="success-icon">🎉</div>
  <h2>ลงทะเบียนสำเร็จ!</h2>
  <p>น้อง Powdy พร้อมช่วยท่านแล้วครับ<br/>กลับไปที่ LINE แล้วส่งรูปสินค้าได้เลย</p>
  <button class="btn-close" onclick="liff.closeWindow()">กลับไป LINE</button>
</div>

<script>
const LIFF_ID = "2010147903-Kbr1m6do";
const N8N_WEBHOOK_URL = "https://sotheeratach.app.n8n.cloud/webhook/powdy-register";

let lineProfile = null;

async function initLiff() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    lineProfile = await liff.getProfile();
    document.getElementById("line-display-name").textContent = lineProfile.displayName;
    document.getElementById("loading").classList.add("hide");
    document.getElementById("form-screen").style.display = "flex";
  } catch (err) {
    document.getElementById("loading").innerHTML = '<p style="color:#e53935;padding:24px;text-align:center;">เกิดข้อผิดพลาด กรุณาปิดแล้วเปิดใหม่</p>';
  }
}

document.addEventListener("DOMContentLoaded", function() {
  document.getElementById("role").addEventListener("change", function() {
    const hint = document.getElementById("role-hint");
    if (this.value === "driver" || this.value === "supervisor") {
      hint.textContent = "⚠️ บทบาทนี้จะถูกถามสาขาทุกครั้งที่ส่งรูป";
      hint.classList.add("show");
    } else { hint.classList.remove("show"); }
  });
});

function validate() {
  const fields = [
    { id: "full_name", fieldId: "field-full-name" },
    { id: "employee_id", fieldId: "field-employee-id" },
    { id: "primary_branch", fieldId: "field-primary-branch" },
    { id: "role", fieldId: "field-role" }
  ];
  let valid = true;
  fields.forEach(f => {
    const el = document.getElementById(f.id);
    const wrap = document.getElementById(f.fieldId);
    const empty = !el.value.trim();
    el.classList.toggle("error", empty);
    wrap.classList.toggle("has-error", empty);
    if (empty) valid = false;
  });
  return valid;
}

async function submitForm() {
  if (!validate()) return;
  const btn = document.getElementById("btn-submit");
  btn.disabled = true;
  btn.classList.add("loading");
  const role = document.getElementById("role").value;
  const primary_branch = document.getElementById("primary_branch").value.trim();
  const payload = {
    user_id: lineProfile.userId,
    display_name: lineProfile.displayName,
    full_name: document.getElementById("full_name").value.trim(),
    employee_id: document.getElementById("employee_id").value.trim(),
    primary_branch,
    role,
    requires_branch_prompt: role === "driver" || role === "supervisor",
    last_used_branch: primary_branch,
    registered_at: new Date().toISOString(),
    updated_at: new Date().toISOString()
  };
  try {
    const res = await fetch(N8N_WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    document.getElementById("form-screen").style.display = "none";
    document.getElementById("success-screen").classList.add("show");
  } catch (err) {
    alert("เกิดข้อผิดพลาดในการส่งข้อมูล กรุณาลองใหม่อีกครั้ง");
    btn.disabled = false;
    btn.classList.remove("loading");
  }
}

initLiff();
</script>
</body>
</html>
